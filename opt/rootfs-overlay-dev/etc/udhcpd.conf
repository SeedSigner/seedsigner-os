# udhcpd config for the usb0 gadget interface (USB relay). Only started when
# no DHCP server answers on usb0 first (see S35network) -- i.e. the host
# isn't sharing its internet connection, so the Pi provides just enough DHCP
# for the host to auto-configure and reach root@10.55.0.1.
start		10.55.0.2
end		10.55.0.6
interface	usb0
lease_file	/var/lib/misc/udhcpd.leases
option		subnet	255.255.255.248
option		router	10.55.0.1
option		dns	10.55.0.1
option		lease	3600
