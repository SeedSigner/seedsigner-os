image boot.vfat {
  vfat {
    files = {
      "bcm2710-rpi-zero-2-w.dtb",
      "bcm2710-rpi-3-b.dtb",
      "bcm2710-rpi-3-b-plus.dtb",
      "bcm2837-rpi-3-b.dtb",
      "rpi-firmware/bootcode.bin",
      "rpi-firmware/cmdline.txt",
      "rpi-firmware/config.txt",
      "rpi-firmware/fixup_x.dat",
      "rpi-firmware/start_x.elf",
      "rpi-firmware/overlays",
      "zImage"
    }
    label = "SEEDSIGNDEV"
  }
  size = 256M
}

# Persistent scratch space for on-device development (git clones, venvs,
# dropbear host keys, ...). Mounted at /mnt/data by S30devdata.
image data.ext4 {
  ext4 {
    label = "seedsigner-data"
    use-mke2fs = true
  }
  size = 256M
}

image seedsigner_os.img {
  hdimage {
  }

  partition boot {
    partition-type = 0xC
    bootable = "true"
    image = "boot.vfat"
  }

  partition data {
    partition-type = 0x83
    image = "data.ext4"
  }
}
